name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests on SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q

  postgres:
    name: Backend (migrations + tests on PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: pursely
          POSTGRES_PASSWORD: pursely
          POSTGRES_DB: pursely
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pursely"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pursely:pursely@localhost:5432/pursely
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrate up, down and up again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Fail if models and migrations have drifted
        run: alembic check
      - name: Run the test suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pursely:pursely@localhost:5432/pursely_test
        run: |
          PGPASSWORD=pursely psql -h localhost -U pursely pursely -c "create database pursely_test"
          python -m pytest -q
      - name: Boot the API and check health
        run: |
          RUN_SCHEDULER=false uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          echo "API did not become healthy" && exit 1

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { name: api, context: backend }
          - { name: web, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
