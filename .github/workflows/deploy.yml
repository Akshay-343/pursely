name: Deploy

# Manual deploy to your server over SSH. Run it from the Actions tab after "Publish Docker images" has finished.
# Protect it by adding required reviewers to the "production" environment (Settings > Environments).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (main, latest, 1.2.3 or sha-abc1234)"
        required: true
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and required secrets
        env:
          TAG: ${{ inputs.tag }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid tag '$TAG'"; exit 1; }
          for v in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v (see docs/DEPLOY.md)"; exit 1; }
          done

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TAG: ${{ inputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The registry token is sent inside the SSH stdin stream (prepended to the script),
          # so it never appears in a command line or the server's process list.
          { printf "export REGISTRY_TOKEN='%s'\n" "$REGISTRY_TOKEN"; cat scripts/remote-deploy.sh; } |
            ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
              "REGISTRY_USER='$REGISTRY_USER' IMAGE_API='$IMAGE_BASE-api:$TAG' IMAGE_WEB='$IMAGE_BASE-web:$TAG' DEPLOY_PATH='$DEPLOY_PATH' bash -s"
